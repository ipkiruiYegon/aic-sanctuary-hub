<!DOCTYPE html>
<html lang="en" data-theme="aic">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AIC Sanctuary Hub</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/custom.css') }}">
</head>

<body class="bg-gradient-to-br from-red-50 to-gray-100 min-h-screen flex items-center justify-center p-4 relative">



    <!-- Login container -->
    <div class="card w-full max-w-sm bg-base-100 shadow-xl p-6 rounded-lg border border-red-300">
        <img src="{{ url_for('static', path='images/aic.png') }}" alt="AIC Kenya Logo"
            class="mx-auto mb-2 w-full max-w-[280px] h-[60px] object-contain" />
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">
            Login to AIC Sanctuary Hub
        </h2>

        <form id="loginForm" action="/auth/authenticate" method="post" class="space-y-4">
            <!-- Telephone input -->
            <div
                class="flex items-center border border-gray-300 rounded px-3 py-2 focus-within:ring-2 focus-within:ring-red-700">
                <div class="flex items-center pr-3 mr-3 border-r-2 border-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-500" fill="currentColor"
                        viewBox="0 0 24 24">
                        <path
                            d="M2 3a1 1 0 011-1h3a1 1 0 011 .8l1 5a1 1 0 01-.3.9l-2 2a16 16 0 007.1 7.1l2-2a1 1 0 01.9-.3l5 1a1 1 0 01.8 1v3a1 1 0 01-1 1h-2C9.7 21 3 14.3 3 6V4a1 1 0 01-1-1z" />
                    </svg>
                </div>
                <input type="tel" name="username" placeholder="Phone Number" required pattern="0[0-9]{9}"
                    class="flex-1 outline-none border-none bg-transparent text-sm sm:text-base" />
            </div>

            <!-- Password input -->
            <div
                class="flex items-center border border-gray-300 rounded px-3 py-2 focus-within:ring-2 focus-within:ring-red-700">
                <div class="flex items-center pr-3 mr-3 border-r-2 border-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-500" fill="currentColor"
                        viewBox="0 0 24 24">
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M12 1a5 5 0 00-5 5v4H6a2 2 0 00-2 2v9a2 2 0 002 2h12a2 2 0 002-2v-9a2 2 0 00-2-2h-1V6a5 5 0 00-5-5zm-3 9V6a3 3 0 116 0v4H9z" />
                    </svg>
                </div>
                <input type="password" name="password" placeholder="Password" required
                    class="flex-1 outline-none border-none bg-transparent text-sm sm:text-base" />
            </div>

            <!-- Submit button -->
            <button type="submit" class="btn btn-primary w-full bg-red-700 hover:bg-red-800 border-none mt-3">
                Login
            </button>
        </form>
        <p class="text-center text-sm text-gray-600 mt-4">
            Don't have an account?
            <a href="/register" class="text-red-700 hover:underline">Register here</a>
    </div>

    <!-- Toast container -->
    <div id="toastContainer" class="fixed top-4 left-1/2 -translate-x-1/2 
            flex flex-col items-center space-y-2 z-50 
            w-full sm:w-auto sm:max-w-sm px-4">
    </div>

    <script src="/static/js/toast.js"></script>
    <script>
        const phoneInput = document.querySelector('input[name="username"]');
        phoneInput.addEventListener("input", function () {
            const regex = /^0\d{9}$/;
            if (!regex.test(this.value)) {
                this.setCustomValidity("Phone number must be 10 digits and start with 0");
            } else {
                this.setCustomValidity("");
            }
        });

        const form = document.getElementById("loginForm");
        form.addEventListener("submit", async function (e) {
            e.preventDefault();
            const formData = new FormData(form);
            const payload = {
                phone: formData.get("username"),
                password: formData.get("password")
            };

            try {
                const response = await fetch("/auth/authenticate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (response.redirected) {
                    window.location.href = response.url;
                } else if (response.ok) {
                    window.location.href = "/dashboard";
                } else {
                    const err = await response.json();
                    showToast(err.detail || "Login failed", "error");
                }
            } catch (err) {
                showToast("Network error. Please try again.", "error");
            }
        });
    </script>
</body>

</html>
