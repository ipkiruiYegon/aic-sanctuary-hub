<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AIC Sanctuary Hub</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="auth">
    <div class="login-container">
        <h2>Login to AIC Sanctuary Hub</h2>
        <form id="loginForm" action="/api/v1/auth/authenticate" method="post">
            <input type="text" name="username" placeholder="Phone Number" required pattern="0[0-9]{9}">
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
    <!-- Toast container -->
    <div class="toast-container" id="toastContainer"></div>
    <script src="/static/js/script.js"></script>
</body>
<script>
    const phoneInput = document.querySelector('input[name="username"]');
    phoneInput.addEventListener("input", function () {
        const regex = /^0\d{9}$/;
        if (!regex.test(this.value)) {
            this.setCustomValidity("Phone number must be 10 digits and start with 0");
        } else {
            this.setCustomValidity("");
        }
    });

    const form = document.getElementById("loginForm");

    form.addEventListener("submit", async function (e) {
        e.preventDefault(); // prevent normal form submission

        const formData = new FormData(form);
        const payload = {
            phone: formData.get("username"),
            password: formData.get("password")
        };

        try {
            const response = await fetch("/api/v1/auth/authenticate", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (response.redirected) {
                // If FastAPI returned a RedirectResponse
                window.location.href = response.url;
            } else if (response.ok) {
                // If you return JSON with success info
                window.location.href = "/dashboard";
            } else {
                const err = await response.json();
                showToast(err.detail || "Login failed", "error");

            }
        } catch (err) {
            showToast("Network error. Please try again.", "error");

        }
    });

</script>

</html>
