<!DOCTYPE html>
<html lang="en" data-theme="aic">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/custom.css') }}">
    <title>Password Change - AIC Sanctuary Hub</title>
</head>

<body class="bg-gradient-to-br from-red-50 to-gray-100 min-h-screen flex items-center justify-center p-4 relative">

    <div class="card w-full max-w-sm bg-base-100 shadow-xl p-6 rounded-lg border border-red-300">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Change Password</h2>
        <form id="passwordForm" action="/auth/change" method="post" class="space-y-4">
            <label for="oldpassword">Old Password:</label>

            <input type="password" name="oldPassword" placeholder="Old Password" required
                class="input input-bordered w-full">
            <label for="newpassword">New Password:</label>
            <input type="password" name="newPassword" placeholder="New Password" required
                class="input input-bordered w-full">
            <label for="confirmpassword">Confirm Password:</label>
            <input type="password" name="confirmPassword" placeholder="Confirm Password" required
                class="input input-bordered w-full">
            <button type="submit" class="btn btn-secondary w-full border-none mt-3">Change
                Password</button>
        </form>
    </div>

    <!-- Toast container -->
    <div id="toastContainer" class="fixed top-4 left-1/2 -translate-x-1/2 
            flex flex-col items-center space-y-2 z-50 
            w-full sm:w-auto sm:max-w-sm px-4">
    </div>

    <script src="/static/js/toast.js"></script>

</body>
<script>
    const form = document.getElementById("passwordForm");

    form.addEventListener("submit", async function (e) {
        e.preventDefault(); // prevent normal form submission
        const newPassword = form.querySelector("[name='newPassword']").value;
        const confirmPassword = form.querySelector("[name='confirmPassword']").value;

        if (newPassword !== confirmPassword) {
            return showToast("Password do not match.", "error")
        }
        const formData = new FormData(form);
        const payload = {
            oldPassword: formData.get("oldPassword"),
            newPassword: formData.get("newPassword"),
            confirmPassword: formData.get("confirmPassword")
        };

        try {
            const response = await fetch("/auth/password/change", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (response.redirected) {
                // If FastAPI returned a RedirectResponse
                window.location.href = response.url;
            } else if (response.ok) {
                // If you return JSON with success info
                window.location.href = "/login";
            } else {
                const err = await response.json();
                showToast(err.detail || "Login failed", "error");

            }
        } catch (err) {
            showToast("Network error. Please try again.", "error");

        }
    });

</script>

</html>
