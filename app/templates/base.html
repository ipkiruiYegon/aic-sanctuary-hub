<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIC Sanctuary Hub</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Font Awesome CDN -->
    <script src="https://kit.fontawesome.com/3113c7c9da.js" crossorigin="anonymous"></script>
</head>

<body>
    <nav class=" sidebar">
        <h2 class="sidebar-title">AIC Sanctuary Hub</h2>

        <ul class="menu">
            <li class="{% if request.url.path == '/dashboard' %}active{% endif %}"><a href="/"><i
                        class="fas fa-home"></i>
                    Dashboard</a></li>
            <li class="{% if request.url.path == '/notifications' %}active{% endif %}"><a href="/notifications"><i
                        class="fas fa-bell"></i> Notifications</a></li>
            <li class="{% if request.url.path == '/users/' %}active{% endif %}"><a href="/users"><i
                        class="fas fa-users"></i> User Management</a></li>
            <li class="{% if request.url.path == '/council/' %}active{% endif %}"><a href="/council"><i
                        class="fas fa-church"></i> Council Management</a></li>
            <li class="{% if request.url.path == '/events' %}active{% endif %}"><a href="/events"><i
                        class="fas fa-calendar-alt"></i> Events Management</a></li>
        </ul>

    </nav>
    <main class="content">
        <!-- Global app title -->
        <h1 class="app-title">
            <a href="/council/structure">AIC {{ region.name }} Region Sanctuary Hub</a>
        </h1>


        {% block content %}{% endblock %}

    </main>


    <!-- Toast container -->
    <div class="toast-container" id="toastContainer"></div>
    <script src="/static/js/htmx.min.js"></script>
    <script src="/static/js/script.js"></script>
    <script>
        const setupInactivityLogout = () => {
            let timer
            let debounceTimer

            const resetTimer = () => {
                clearTimeout(timer)

                timer = setTimeout(() => {
                    fetch("/api/v1/auth/logout", {
                        method: "POST",
                        headers: { "content-type": "application/json" },
                    })
                        .then(() => {
                            localStorage.removeItem("access_token")
                            localStorage.removeItem("refresh_token")
                            window.location.href = "/login"
                        })
                        .catch(() => {
                            window.location.href = "/login"
                        })
                }, 2 * 60 * 1000)

            }

            const debouncedReset = () => {
                clearTimeout(debounceTimer)
                debounceTimer = setTimeout(resetTimer, 250)
            }

            document.addEventListener("mousemove", debouncedReset)
            document.addEventListener("keydown", debouncedReset)
            document.addEventListener("touchstart", debouncedReset)

            resetTimer()

        }

        setupInactivityLogout()    
    </script>
    {% block scripts %}{% endblock %}

</body>

</html>
